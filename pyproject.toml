[project]
name = "lecture-pipeline"
version = "0.1.0"
description = "Automated university lecture speech-to-text, cleanup, summarization, and notebook ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "opencc-python-reimplemented>=0.1.7",
    "jiwer>=3.1.0",
    "watchdog>=6.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_pipeline"]

[tool.pytest.ini_options]
addopts = "--basetemp=./.pytest_tmp"
