paths:
  inbox_dir: inbox
  work_dir: work
  archive_dir: archive
  record_archive_dir: record_archive
  logs_dir: logs
  benchmark_dir: benchmark
  prompts_dir: prompts
  courses_dir: courses
  exports_dir: exports
preprocessing:
  hp: 100Hz
  loud: -19LUFS
  dyn: 'off'
  nr: 'off'
  dfn: 'off'
  se: 'off'
  wpe: 'off'
  vadtrim: 'off'
segmentation:
  target_chunk_sec: 600
  search_window_sec: 30
  silence_thresh_db: -40
  min_silence_sec: 0.5
  overlap_sec: 0
stt:
  default_channel: C1
  fallback_local_channel: C7
  prompt_style: verbatim
  temperature: 0.0
  opencc_config: s2twp
cleanup:
  mode: text
  model: gemini-3.5-flash-lite
  prompt_template: videolingo_punct.md
  chunk_chars: 1500
  overlap_chars: 300
  length_ratio_min: 0.8
  length_ratio_max: 1.2
summarize:
  model: gemini-3.5-flash-lite
  template: fabric_summarize_lecture.md
  thinking_budget: 1024
export:
  export_dir: exports
  auto_open_notebooklm: false
  notebooklm_url: https://notebooklm.google.com/
quota_policy:
  on_quota_exhausted: local_then_defer
  daily_reset_hour_utc: 8
timetable:
  enabled: false
  Monday: null
  Tuesday: null
  Wednesday: null
  Thursday: null
  Friday: null
  Saturday: null
  Sunday: null
gui:
  mode: window
  host: 127.0.0.1
  port: 8000
  auto_open_browser: true
  window_width: 1280
  window_height: 800
