# ==============================================================================
# 課堂錄音自動化處理管線設定 (Lecture Pipeline Configuration)
# ==============================================================================

# 系統路徑設定
paths:
  inbox_dir: "inbox"
  work_dir: "work"
  archive_dir: "archive"
  record_archive_dir: "C:\\Users\\LinKJ\\Pictures\\Record"
  logs_dir: "logs"
  benchmark_dir: "benchmark"
  prompts_dir: "prompts"
  courses_dir: "courses"

# 預設前處理開關 (针对 SONY ICD-PX470 桌面錄製最佳化)
preprocessing:
  # 可選值:
  # hp: off | 80Hz | 100Hz | 120Hz (消除桌面振動與冷氣低頻)
  # loud: off | -16LUFS | -19LUFS | -23LUFS (EBU R128 音量正規化)
  # dyn: off | light | standard (動態音量平衡，拉近走動音量差)
  # nr: off | 6dB | 12dB | 18dB (頻譜降噪)
  # dfn: off | on (DeepFilterNet3 深度降噪)
  # se: off | on (MossFormer2 語音增強)
  # wpe: off | on (去殘響)
  # vadtrim: off | on (修剪前端長靜音)
  hp: "100Hz"
  loud: "-19LUFS"
  dyn: "off"
  nr: "off"
  dfn: "off"
  se: "off"
  wpe: "off"
  vadtrim: "off"

# VAD 與切段設定 (保守穩定策略，絕不切滿單次上限)
segmentation:
  # 目標切段時長 (秒): 600s = 10分鐘 (Gemini 3.8 Flash 最穩且快)
  target_chunk_sec: 600
  # 靜音搜尋搜尋半徑 (秒): 在目標時間點 ±30s 內尋找停頓
  search_window_sec: 30
  # 靜音判定閾值 (dB)
  silence_thresh_db: -40
  # 最短靜音長度 (秒)
  min_silence_sec: 0.5
  # 片段重疊 (秒): 0 代表精確在靜音處切割
  overlap_sec: 0

# STT 語音辨識設定
stt:
  # 預設通道: C1 (Gemini Flash Audio Verbatim)
  default_channel: "C1"
  # 備援通道 (額度用完或網路異常時自動切換之本地模型): C7 (Whisper Large-v3-Turbo)
  fallback_local_channel: "C7"
  # 辨識 Prompt 策略: verbatim (字字逐字) | polite_clean (去贅字)
  prompt_style: "verbatim"
  # 溫度
  temperature: 0.0
  # 簡轉繁策略: s2twp (台灣慣用詞繁體) | s2tw (標準繁體)
  opencc_config: "s2twp"

# 內文整理設定
cleanup:
  # 模式: text (純文字整理) | audio (聽音檔修正) | fusion (雙通道比對融合)
  mode: "text"
  model: "gemini-3.5-flash-lite"
  prompt_template: "videolingo_punct.md"
  # 每次送進整理模型的字元數 (分段保證零摘要與低延遲)
  chunk_chars: 1500
  overlap_chars: 300
  # 字數守恆容許區間 (輸出字數 / 輸入字數)
  length_ratio_min: 0.80
  length_ratio_max: 1.20

# 重點總結設定
summarize:
  model: "gemini-3.5-flash-lite"
  template: "fabric_summarize_lecture.md"
  thinking_budget: 1024

# 匯出與 NotebookLM 整合設定
export:
  # 匯出目錄 (可設為 Google Drive 本地同步資料夾或本機自訂目錄)
  export_dir: "exports"
  # 自動於瀏覽器開啟 NotebookLM
  auto_open_notebooklm: false
  # NotebookLM 服務網址
  notebooklm_url: "https://notebooklm.google.com/"

# 額度用完因應策略
quota_policy:
  # 可選值:
  # local_then_defer: 本地跑 STT 產出 raw.txt，整理與總結排入佇列等隔天重置補跑 (預設 c 方案)
  # wait: 暫停並等待額度重置
  # local_all: 全部轉由本地完成
  on_quota_exhausted: "local_then_defer"
  # 每天免費額度重置時間 (估計為 UTC 08:00 / 台灣時間 16:00)
  daily_reset_hour_utc: 8

# 課表排程自動對齊 (針對錄音筆原始未命名音檔 YYMMDD_HHMM 如 261016_0915 自動識別科目)
timetable:
  enabled: true  # 預設關閉，填妥課表並設為 true 即可享受無感課表自動分類
  Monday:
  Tuesday:
    - time: "9:00-11:00"
      course: "人文通識:世界文明史"
    - time: "11:00-13:00"
      course: "人文通識:藝術欣賞"
    - time: "13:00-16:00"
      course: "光電子學"
    - time: "16:00-18:00"
      course: "科技英文導讀"
  Wednesday:
  Thursday:
  Friday:
    - time: "09:00-12:00"
      course: "電磁學"

# GUI 雙軌介面設定 (Windows 原生視窗 / 網頁瀏覽器 / 同時使用)
gui:
  mode: "both"  # 記憶上次執行模式: window (Windows 獨立視窗) | web (瀏覽器) | both (雙軌同時使用)
  host: "127.0.0.1"
  port: 8000
  auto_open_browser: true
  window_width: 1280
  window_height: 800

