[project]
name = "lecture-pipeline"
version = "0.1.0"
description = "Automated university lecture speech-to-text, cleanup, summarization, and notebook ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "opencc-python-reimplemented>=0.1.7",
    "jiwer>=3.1.0",
    "watchdog>=6.0.0",
    "requests>=2.32.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "pypdf>=6.21.0",
    "win11toast>=0.36.3",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "pywebview>=6.2.1",
    "websockets>=16.1.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "cython>=3.3.0",
    "pyarmor>=9.2.7",
    "pyinstaller>=6.22.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-minifier>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lecture-pipeline = "lecture_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_pipeline"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"

